<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="DECIMAG — Not every authorized action has the right to act" />
  <meta name="theme-color" content="#000000" />
  <title>DECIMAG</title>

  <style>
    :root {
      --bg: #000;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --line: rgba(255, 255, 255, 0.14);
      --focus: rgba(255, 255, 255, 0.22);
      --max-width: 760px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }

    .content {
      width: min(100%, var(--max-width));
      text-align: center;
      animation: page-in 900ms ease-out both;
    }

    .brand {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 4.8rem);
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .tagline {
      max-width: 720px;
      margin: 32px auto 0;
      font-size: clamp(1.2rem, 3.4vw, 2rem);
      line-height: 1.35;
      font-weight: 400;
      font-style: italic;
    }

    .actions {
      display: grid;
      gap: 14px;
      margin-top: clamp(48px, 8vw, 76px);
    }

    .action {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      font-size: clamp(1.05rem, 2.5vw, 1.32rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease;
    }

    .action:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.055);
    }

    .action:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .icon {
      width: 1.35em;
      height: 1.35em;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .footer-note {
      margin-top: 36px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    @keyframes page-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .content { animation: none; }
      .action { transition: none; }
    }

    @media (max-width: 520px) {
      .page { padding: 36px 18px; }
      .tagline { margin-top: 24px; }
      .actions { margin-top: 42px; }
      .action {
        min-height: 66px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content" aria-labelledby="page-title">
      <h1 class="brand" id="page-title">DECIMAG</h1>

      <p class="tagline">
        Not every authorized action has the right to act
      </p>

      <nav class="actions" aria-label="DECIMAG links">
        <a class="action" href="./WhatsApp Video 2026-07-28 at 15.36.34.mp4" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">▶</span>
          <span>Watch the film</span>
        </a>

        <a class="action" href="https://gadilavi10-pixel.github.io/Cyber-scenario-demo/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">◆</span>
          <span>Try the interactive demo</span>
        </a>

        <a class="action" href="https://arxiv.org/abs/2604.24153" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">▤</span>
          <span>Read the paper (arXiv)</span>
        </a>

        <a class="action" href="mailto:gadi@decimag.com">
          <span class="icon" aria-hidden="true">✉</span>
          <span>Contact</span>
        </a>
      </nav>

      <p class="footer-note">Right-to-Act Protocol</p>
    </section>
  </main>
</body>
</html>
